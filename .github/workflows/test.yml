name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run quality

  # The suite above runs under Bun only, but Node is the target runtime — the
  # shipped bin's shebang is node (engines.node >=20.0.0, happy-dom's own
  # floor). Without this, a Node-only break would only surface at release time —
  # or for a user.
  #
  # smoke:pack also exercises Deno, hence setup-deno here. The job keeps the id
  # `node` on purpose: it is a required status check, and renaming it would make
  # branch protection wait forever on a check that no longer runs.
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.x
      - run: bun install --frozen-lockfile
      - run: bun run smoke:node
      # Installs the packed tarball and runs it the way users get it, which
      # smoke:node can't — it runs cli.ts from the checkout, where Node's type
      # stripping is allowed and node_modules' isn't. Gates Node, Bun and Deno.
      - run: bun run smoke:pack
