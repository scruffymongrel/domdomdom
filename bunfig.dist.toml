[test]
# The dist-target run of the same suite (`bun run test:dist`), which loads
# ../dist/index.js and ../dist/cli.js instead of the .ts source.
#
# Coverage is off here, and that is the whole reason this file exists: the gate
# in bunfig.toml is 100% lines+functions on index.ts and cli.ts, and under
# DOMDOMDOM_TEST_DIST=1 neither of those files is ever loaded. The run would
# report ~0% and fail on a threshold that says nothing about the built output.
# The src run in bunfig.toml keeps the gate; this run checks behaviour.
#
# NB: `bun test --config=bunfig.dist.toml` needs the `=`. With a space
# (`--config bunfig.dist.toml`) bun silently ignores the file and applies
# bunfig.toml instead — the only visible difference is a coverage table
# appearing in the output.
coverage = false
