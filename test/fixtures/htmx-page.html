<!doctype html>
<!--
  Loads htmx via an ordinary <script src>, which is the case that matters:
  htmx instantiates XPathEvaluator at script-parse time, so the polyfill has
  to be installed before that tag runs.

  htmx-4.0.0-beta6.min.js is vendored unmodified from jig
  (~/jig/app-jsx/public/vendor/htmx/htmx.min.js, md5
  2a7e97e74c30336bdc7eb775670518dd), 0BSD — see the .LICENSE alongside it.
  That build is the original repro: it couldn't execute under domdomdom at all
  before XPath support landed.
-->
<title>htmx page</title>
<!--
  #target holds an element with an id, and htmx-fragment.html serves one with
  the same id: that id match is what gives htmx settle tasks to run, which is
  what makes it `await this.timeout(settleDelay)` on every swap.
-->
<div id="target"><span id="inner">before</span></div>
<button hx-get="./htmx-fragment.html" hx-target="#target">Load</button>
<script src="./htmx-4.0.0-beta6.min.js"></script>
